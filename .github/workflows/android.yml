name: Test and build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.5.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Godot binary and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 -O "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 -O "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 -O "$release/SHA512-SUMS.txt"
          sha512sum --check --ignore-missing SHA512-SUMS.txt
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -j -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" 'templates/android_debug.apk' 'templates/android_release.apk' -d "$templates"
      - name: Configure Android SDK and a disposable debug key
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'
          keytool -genkeypair -keystore "$RUNNER_TEMP/arrow-rush-debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/arrow-rush-debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path.home() / '.config/godot/editor_settings-4.5.tres'
          sdk = os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT']
          path.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = ' + json.dumps(os.environ['JAVA_HOME']) + '\nexport/android/android_sdk_path = ' + json.dumps(sdk) + '\n')
          PY
      - name: Import and run engine, generator, persistence and app tests
        run: python3 tools/run_checks.py
      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/ArrowRush-debug.apk 2>&1 | tee build/export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' build/export.log; then exit 1; fi
          test -s build/ArrowRush-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/ArrowRush-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/ArrowRush-debug.apk > build/apk-info.txt
          sha256sum build/ArrowRush-debug.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArrowRush-debug-APK
          path: |
            build/ArrowRush-debug.apk
            build/apk-info.txt
            build/SHA256SUMS.txt
          if-no-files-found: error
